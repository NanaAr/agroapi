<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ფოთლის ანალიზატორი</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --good: #2d6a4f;
    --good-light: #d8f3dc;
    --bad: #9b2226;
    --bad-light: #ffe0e0;
    --neutral: #1b1b1b;
    --bg: #f5f0e8;
    --card: #ffffff;
    --text: #1b1b1b;
    --muted: #7a7060;
    --border: #e0d9cc;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 2rem 1.5rem 1rem;
    text-align: center;
    position: relative;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--good), #52b788, var(--good));
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 6vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--neutral);
  }

  .logo span {
    color: var(--good);
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.3rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  main {
    width: 100%;
    max-width: 480px;
    padding: 1rem 1.25rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .camera-card {
    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }

  #video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #webcam-canvas, #preview-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #preview-img { display: none; }

  .camera-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 300;
  }

  .camera-overlay svg {
    opacity: 0.6;
  }

  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: rgba(255,255,255,0.5);
    border-style: solid;
  }
  .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

  .scanning-line {
    position: absolute;
    left: 16px; right: 16px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: scan 2s ease-in-out infinite;
    display: none;
  }

  @keyframes scan {
    0% { top: 16px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: calc(100% - 16px); opacity: 0; }
  }

  .scanning-line.active { display: block; }

  .controls {
    padding: 1rem;
    display: flex;
    gap: 0.75rem;
  }

  .btn {
    flex: 1;
    padding: 0.85rem 1rem;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--good);
    color: #fff;
  }

  .btn-secondary {
    background: #f0ece4;
    color: var(--neutral);
    border: 1px solid var(--border);
  }

  #file-input { display: none; }

  .result-card {
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(10px);
    opacity: 0;
    display: none;
  }

  .result-card.visible {
    display: block;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .result-card.good {
    background: var(--good-light);
    border: 1.5px solid #95d5b2;
  }

  .result-card.bad {
    background: var(--bad-light);
    border: 1.5px solid #f4a0a0;
  }

  .result-inner {
    padding: 1.5rem 1.25rem;
  }

  .result-emoji {
    font-size: 3rem;
    display: block;
    margin-bottom: 0.5rem;
  }

  .result-label {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  .result-card.good .result-label { color: var(--good); }
  .result-card.bad .result-label { color: var(--bad); }

  .result-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .bar-row {
    margin-bottom: 0.6rem;
  }

  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    font-weight: 500;
    margin-bottom: 0.3rem;
  }

  .bar-track {
    height: 8px;
    background: rgba(0,0,0,0.08);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .bar-fill.good { background: var(--good); }
  .bar-fill.bad { background: var(--bad); }

  .status-msg {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 0.5rem 0;
    min-height: 1.5rem;
  }

  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .loading-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: dot 1.2s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .instructions {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 1rem 1.25rem;
  }

  .instructions h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .instructions li {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    list-style: none;
    padding-left: 0;
    display: flex;
    gap: 0.4rem;
    align-items: flex-start;
  }

  .mode-toggle {
    display: flex;
    gap: 0.5rem;
    background: #ece7de;
    border-radius: 12px;
    padding: 4px;
  }

  .mode-btn {
    flex: 1;
    padding: 0.5rem;
    border: none;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--card);
    color: var(--neutral);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>

<header>
  <div class="logo">ფოთ<span>ლი</span></div>
  <div class="subtitle">ხის ფოთლის ანალიზატორი</div>
</header>

<main>
  <!-- Mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-camera" onclick="switchMode('camera')">📷 კამერა</button>
    <button class="mode-btn" id="btn-upload" onclick="switchMode('upload')">🖼️ ფოტო</button>
  </div>

  <!-- Camera card -->
  <div class="camera-card">
    <div id="video-container">
      <canvas id="webcam-canvas"></canvas>
      <img id="preview-img" alt="preview">
      <div class="camera-overlay" id="cam-overlay">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>კამერა გასააქტიურებლად<br>დააჭირე ღილაკს</span>
      </div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanning-line" id="scan-line"></div>
    </div>

    <div class="controls" id="camera-controls">
      <button class="btn btn-secondary" id="btn-start-cam" onclick="startCamera()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        გაქტიურება
      </button>
      <button class="btn btn-primary" id="btn-capture" onclick="capture()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3A8 8 0 1 0 17.7 17.7"/><path d="M20 12a8 8 0 0 0-8-8"/></svg>
        გადაღება
      </button>
    </div>

    <div class="controls" id="upload-controls" style="display:none">
      <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        ფოტოს ატვირთვა
      </button>
      <button class="btn btn-primary" id="btn-analyze-upload" onclick="analyzeUpload()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        ანალიზი
      </button>
    </div>
    <input type="file" id="file-input" accept="image/*" onchange="previewUpload(event)">
  </div>

  <div class="status-msg" id="status"></div>

  <!-- Result card -->
  <div class="result-card" id="result-card">
    <div class="result-inner">
      <span class="result-emoji" id="result-emoji">🍃</span>
      <div class="result-label" id="result-label">—</div>
      <div class="result-sub" id="result-sub">—</div>
      <div class="bar-row">
        <div class="bar-label">
          <span>კარგი ფოთოლი</span>
          <span id="pct-good">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill good" id="bar-good" style="width:0%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label">
          <span>ცუდი ფოთოლი</span>
          <span id="pct-bad">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill bad" id="bar-bad" style="width:0%"></div></div>
      </div>
    </div>
  </div>


</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/gwL45DxOb/';
let model = null;
let webcam = null;
let currentMode = 'camera';
let cameraActive = false;

async function loadModel() {
  setStatus('<span class="loading-dots"><span></span><span></span><span></span></span> მოდელი იტვირთება...');
  try {
    const modelURL = MODEL_URL + 'model.json';
    const metadataURL = MODEL_URL + 'metadata.json';
    model = await tmImage.load(modelURL, metadataURL);
    setStatus('✅ მოდელი მზადაა');
    setTimeout(() => setStatus(''), 2000);
  } catch (e) {
    setStatus('❌ მოდელის ჩატვირთვა ვერ მოხდა');
    console.error(e);
  }
}

function setStatus(html) {
  document.getElementById('status').innerHTML = html;
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btn-camera').classList.toggle('active', mode === 'camera');
  document.getElementById('btn-upload').classList.toggle('active', mode === 'upload');
  document.getElementById('camera-controls').style.display = mode === 'camera' ? 'flex' : 'none';
  document.getElementById('upload-controls').style.display = mode === 'upload' ? 'flex' : 'none';

  if (mode === 'upload') {
    stopCamera();
  }
}

async function startCamera() {
  if (!model) await loadModel();
  const overlay = document.getElementById('cam-overlay');
  const canvas = document.getElementById('webcam-canvas');
  try {
    setStatus('📷 კამერა ირთვება...');
    webcam = new tmImage.Webcam(canvas.offsetWidth || 400, canvas.offsetWidth || 400, true);
    await webcam.setup({ facingMode: { ideal: 'environment' } });
    await webcam.play();
    canvas.width = webcam.canvas.width;
    canvas.height = webcam.canvas.height;
    overlay.style.display = 'none';
    document.getElementById('btn-start-cam').style.display = 'none';
    document.getElementById('btn-capture').disabled = false;
    cameraActive = true;
    setStatus('');
    requestAnimationFrame(loop);
  } catch (e) {
    setStatus('❌ კამერაზე წვდომა ვერ მოხდა');
    console.error(e);
  }
}

function loop() {
  if (!cameraActive) return;
  webcam.update();
  const ctx = document.getElementById('webcam-canvas').getContext('2d');
  ctx.drawImage(webcam.canvas, 0, 0);
  requestAnimationFrame(loop);
}

function stopCamera() {
  if (webcam) { try { webcam.stop(); } catch(e){} webcam = null; }
  cameraActive = false;
}

async function capture() {
  if (!webcam) return;
  document.getElementById('scan-line').classList.add('active');
  document.getElementById('btn-capture').disabled = true;
  setStatus('<span class="loading-dots"><span></span><span></span><span></span></span> ანალიზი მიმდინარეობს...');

  const canvas = document.getElementById('webcam-canvas');
  await predict(canvas);

  setTimeout(() => {
    document.getElementById('scan-line').classList.remove('active');
    document.getElementById('btn-capture').disabled = false;
  }, 1000);
}

function previewUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = document.getElementById('preview-img');
    const canvas = document.getElementById('webcam-canvas');
    img.style.display = 'none';
    canvas.style.display = 'none';
    document.getElementById('cam-overlay').style.display = 'none';

    const tempImg = new Image();
    tempImg.onload = () => {
      canvas.width = tempImg.width;
      canvas.height = tempImg.height;
      canvas.getContext('2d').drawImage(tempImg, 0, 0);
      canvas.style.display = 'block';
      document.getElementById('btn-analyze-upload').disabled = false;
    };
    tempImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function analyzeUpload() {
  if (!model) await loadModel();
  const canvas = document.getElementById('webcam-canvas');
  setStatus('<span class="loading-dots"><span></span><span></span><span></span></span> ანალიზი მიმდინარეობს...');
  document.getElementById('scan-line').classList.add('active');
  await predict(canvas);
  setTimeout(() => document.getElementById('scan-line').classList.remove('active'), 800);
}

async function predict(imageElement) {
  if (!model) { setStatus('❌ მოდელი არ ჩატვირთულა'); return; }
  try {
    const predictions = await model.predict(imageElement);
    const sorted = predictions.sort((a, b) => b.probability - a.probability);
    const top = sorted[0];

    const isGood = top.className.toLowerCase().includes('good') ||
                   top.className.toLowerCase().includes('კარგ') ||
                   top.className === sorted.reduce((a,b) => a.probability > b.probability ? a : b, sorted[0]).className && sorted.indexOf(top) === 0;

    let goodProb = 0, badProb = 0;
    predictions.forEach(p => {
      const n = p.className.toLowerCase();
      if (n.includes('good') || n.includes('კარგ')) goodProb = Math.round(p.probability * 100);
      else badProb = Math.round(p.probability * 100);
    });

    if (goodProb === 0 && badProb === 0) {
      goodProb = isGood ? Math.round(top.probability * 100) : Math.round((1 - top.probability) * 100);
      badProb = 100 - goodProb;
    }

    showResult(isGood || goodProb >= badProb, goodProb, badProb, top.className);
    setStatus('');
  } catch (e) {
    setStatus('❌ შეცდომა: ' + e.message);
    console.error(e);
  }
}

function showResult(isGood, goodPct, badPct, className) {
  const card = document.getElementById('result-card');
  card.className = 'result-card visible ' + (isGood ? 'good' : 'bad');
  document.getElementById('result-emoji').textContent = isGood ? '🌿' : '🍂';
  document.getElementById('result-label').textContent = isGood ? 'კარგი ფოთოლია!' : 'ცუდი ფოთოლია';
  document.getElementById('result-sub').textContent = isGood
    ? 'ფოთოლი ჯანმრთელი გამოიყურება'
    : 'ფოთოლი დაზიანებული ან ავადმყოფია';
  document.getElementById('pct-good').textContent = goodPct + '%';
  document.getElementById('pct-bad').textContent = badPct + '%';
  setTimeout(() => {
    document.getElementById('bar-good').style.width = goodPct + '%';
    document.getElementById('bar-bad').style.width = badPct + '%';
  }, 100);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

window.addEventListener('load', () => {
  loadModel();
});
</script>
</body>
</html>
